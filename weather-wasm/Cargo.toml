[package]
name = "weather-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
weather = { path = "../weather" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# The homebrew wasm-opt on this machine is older than the bulk-memory /
# nontrapping-float-to-int features rustc now emits by default, so it
# rejects the module. The workspace release profile (opt-level "z", lto,
# strip) already does the size work wasm-opt would otherwise do.
wasm-opt = false
