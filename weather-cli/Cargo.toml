[package]
name = "weather-cli"
version = "0.1.0"
edition = "2021"
description = "Native CLI for the weather crate: estimate, snapshot and leave-one-out validate against IEM observations"
license = "MIT"
repository = "https://github.com/idle-intelligence/weather-web"
publish = false

[dependencies]
weather = { path = "../weather", features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
